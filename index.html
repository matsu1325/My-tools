<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マイ・アプリポータル</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white">

  <header class="border-b border-slate-900 bg-slate-900/40 backdrop-blur sticky top-0 z-50 px-4 py-4">
    <div class="max-w-6xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center shadow-lg shadow-indigo-500/20">
          <svg class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
          </svg>
        </div>
        <div>
          <h1 class="text-lg font-bold tracking-tight text-white leading-none">My App Toolbox</h1>
          <p class="text-[11px] text-slate-400 mt-1">自分専用アプリコレクション</p>
        </div>
      </div>
      <div class="text-xs text-slate-400 bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-xl flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-indigo-500"></span>
        <span>Repository + Local</span>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-6xl w-full mx-auto p-4 md:p-8 space-y-8">
    <section class="bg-gradient-to-r from-indigo-950/40 to-slate-900/40 border border-indigo-900/30 rounded-2xl p-6 relative overflow-hidden shadow-xl">
      <div class="absolute top-0 right-0 w-64 h-64 bg-indigo-500/5 rounded-full blur-3xl pointer-events-none"></div>
      <h2 class="text-xl font-bold text-white mb-2">おかえりなさい！</h2>
      <p class="text-sm text-slate-400 max-w-3xl leading-relaxed">
        リポジトリで管理する標準ツールと、この端末で追加したツールをまとめて表示します。
        標準ツールは <code class="text-indigo-300">apps.js</code> で管理されるため、新しいツールが追加されても既存のローカル登録を消さずに反映できます。
      </p>
    </section>

    <section class="space-y-4">
      <div class="flex items-center justify-between gap-4">
        <h3 class="text-sm font-bold text-slate-400 uppercase tracking-wider flex items-center gap-2">
          <span class="w-1.5 h-3.5 bg-indigo-500 rounded-full inline-block"></span>
          登録アプリ一覧 (<span id="appCount">0</span>)
        </h3>
        <button id="btnOpenAddModal" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold py-2 px-4 rounded-xl flex items-center gap-1.5 transition-all shadow-lg shadow-indigo-500/10 active:scale-95">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
          </svg>
          ローカル追加
        </button>
      </div>

      <div id="appGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>

      <div id="emptyState" class="hidden border border-dashed border-slate-800 rounded-2xl p-12 text-center flex flex-col items-center justify-center">
        <p class="text-sm font-semibold text-slate-300">登録されているアプリがありません</p>
        <p class="text-xs text-slate-500 mt-1 max-w-sm">apps.js に標準ツールを登録するか、「ローカル追加」からこの端末専用のツールを登録してください。</p>
      </div>
    </section>
  </main>

  <div id="addModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm hidden">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-6 shadow-2xl relative">
      <h3 class="text-base font-bold text-white mb-4">ローカルアプリの登録</h3>

      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1.5">アプリの名前</label>
          <input type="text" id="appNameInput" placeholder="例: バイカラー画像ジェネレーター" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 transition-colors">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1.5">ファイル名（同じフォルダ内）</label>
          <input type="text" id="appPathInput" placeholder="例: my-tool.html" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 transition-colors">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1.5">説明文</label>
          <textarea id="appDescInput" placeholder="例: 写真を加工するツール" rows="2" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 transition-colors resize-none"></textarea>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1.5">アイコン（絵文字）</label>
          <input type="text" id="appEmojiInput" placeholder="📦" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 transition-colors text-center">
        </div>
      </div>

      <div class="flex items-center justify-end space-x-2 mt-6">
        <button id="btnCancelAdd" class="px-4 py-2 bg-slate-950 hover:bg-slate-800 text-xs font-medium text-slate-400 hover:text-white rounded-xl transition-colors">キャンセル</button>
        <button id="btnSaveApp" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-xs font-semibold text-white rounded-xl transition-colors">登録する</button>
      </div>
    </div>
  </div>

  <footer class="border-t border-slate-900 bg-slate-950 py-6 text-center text-xs text-slate-500">
    <p>© 2026 My App Toolbox.</p>
  </footer>

  <script src="apps.js"></script>
  <script>
    const STORAGE_KEYS = {
      custom: 'my_toolbox_custom_apps_v2',
      legacy: 'my_toolbox_apps'
    };

    const appGrid = document.getElementById('appGrid');
    const emptyState = document.getElementById('emptyState');
    const appCount = document.getElementById('appCount');

    const addModal = document.getElementById('addModal');
    const btnOpenAddModal = document.getElementById('btnOpenAddModal');
    const btnCancelAdd = document.getElementById('btnCancelAdd');
    const btnSaveApp = document.getElementById('btnSaveApp');

    const appNameInput = document.getElementById('appNameInput');
    const appPathInput = document.getElementById('appPathInput');
    const appDescInput = document.getElementById('appDescInput');
    const appEmojiInput = document.getElementById('appEmojiInput');

    const standardApps = Array.isArray(window.STANDARD_APPS)
      ? window.STANDARD_APPS.map(app => ({ ...app, source: 'standard' }))
      : [];

    function readJson(key, fallback) {
      try {
        const value = JSON.parse(localStorage.getItem(key));
        return value ?? fallback;
      } catch (error) {
        console.warn(`Failed to read ${key}`, error);
        return fallback;
      }
    }

    function normalizePath(path) {
      return String(path || '')
        .trim()
        .toLowerCase()
        .replace(/%20/g, ' ')
        .replace(/\s+/g, '');
    }

    function sameApp(a, b) {
      return Boolean(
        (a.id && b.id && a.id === b.id) ||
        (a.path && b.path && normalizePath(a.path) === normalizePath(b.path))
      );
    }

    function isStandardApp(app) {
      return standardApps.some(standard => sameApp(standard, app));
    }

    function migrateLegacyApps() {
      const existingCustom = localStorage.getItem(STORAGE_KEYS.custom);
      if (existingCustom !== null) {
        return readJson(STORAGE_KEYS.custom, []);
      }

      const legacyApps = readJson(STORAGE_KEYS.legacy, []);
      const migrated = Array.isArray(legacyApps)
        ? legacyApps
            .filter(app => app && !isStandardApp(app))
            .map(app => ({ ...app, source: 'custom' }))
        : [];

      localStorage.setItem(STORAGE_KEYS.custom, JSON.stringify(migrated));
      return migrated;
    }

    let customApps = migrateLegacyApps();

    function getMergedApps() {
      const result = [...standardApps];
      customApps.forEach(custom => {
        if (!result.some(existing => sameApp(existing, custom))) {
          result.push({ ...custom, source: 'custom' });
        }
      });
      return result;
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function isSafeLocalPath(path) {
      const value = String(path || '').trim();
      if (!value) return false;
      if (/^[a-z][a-z0-9+.-]*:/i.test(value)) return false;
      if (value.startsWith('//') || value.startsWith('/') || value.includes('..')) return false;
      return true;
    }

    function renderApps() {
      const apps = getMergedApps();
      appGrid.innerHTML = '';
      appCount.innerText = apps.length;

      if (apps.length === 0) {
        emptyState.classList.remove('hidden');
        return;
      }
      emptyState.classList.add('hidden');

      apps.forEach(app => {
        const card = document.createElement('div');
        card.className = 'bg-slate-900/60 border border-slate-800 hover:border-indigo-500/40 rounded-2xl p-5 flex flex-col justify-between transition-all duration-300 hover:shadow-xl hover:shadow-indigo-500/5 group relative overflow-hidden';

        const isCustom = app.source === 'custom';
        const badge = isCustom
          ? '<span class="text-[10px] px-2 py-0.5 rounded-full bg-amber-500/10 text-amber-300 border border-amber-500/20">ローカル</span>'
          : '<span class="text-[10px] px-2 py-0.5 rounded-full bg-indigo-500/10 text-indigo-300 border border-indigo-500/20">標準</span>';

        const deleteButton = isCustom
          ? `<button onclick="deleteCustomApp('${escapeHtml(app.id)}')" class="absolute top-4 right-4 text-slate-500 hover:text-rose-400 opacity-0 group-hover:opacity-100 transition-opacity p-1.5 hover:bg-slate-950 rounded-lg cursor-pointer" title="ローカル登録から削除">
              <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
              </svg>
            </button>`
          : '';

        const safePath = isSafeLocalPath(app.path) ? escapeHtml(app.path) : '#';

        card.innerHTML = `
          ${deleteButton}
          <div>
            <div class="flex items-center justify-between gap-2 mb-3 pr-7">
              <div class="flex items-center space-x-3 min-w-0">
                <span class="text-3xl filter drop-shadow-sm shrink-0">${escapeHtml(app.emoji || '📦')}</span>
                <h4 class="font-bold text-white group-hover:text-indigo-400 transition-colors truncate">${escapeHtml(app.name || 'Untitled')}</h4>
              </div>
              ${badge}
            </div>
            <p class="text-xs text-slate-400 line-clamp-3 leading-relaxed mb-6">${escapeHtml(app.desc || '説明はありません。')}</p>
          </div>

          <a href="${safePath}" class="w-full bg-slate-950 hover:bg-indigo-600 border border-slate-800 hover:border-indigo-500 text-slate-300 hover:text-white text-xs font-semibold py-2.5 rounded-xl flex items-center justify-center gap-1.5 transition-all active:scale-95">
            アプリを起動
            <svg class="w-3.5 h-3.5 group-hover:translate-x-0.5 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
            </svg>
          </a>
        `;
        appGrid.appendChild(card);
      });
    }

    function setupModalEvents() {
      const closeModal = () => {
        addModal.classList.add('hidden');
        appNameInput.value = '';
        appPathInput.value = '';
        appDescInput.value = '';
        appEmojiInput.value = '';
      };

      btnOpenAddModal.addEventListener('click', () => {
        addModal.classList.remove('hidden');
        appNameInput.focus();
      });

      btnCancelAdd.addEventListener('click', closeModal);

      addModal.addEventListener('click', event => {
        if (event.target === addModal) closeModal();
      });

      btnSaveApp.addEventListener('click', () => {
        const name = appNameInput.value.trim();
        const path = appPathInput.value.trim();
        const desc = appDescInput.value.trim();
        const emoji = appEmojiInput.value.trim();

        if (!name || !path) {
          alert('アプリの名前とファイル名は必須です。');
          return;
        }

        if (!isSafeLocalPath(path)) {
          alert('ファイル名は同じフォルダ内の相対パスで指定してください。');
          return;
        }

        const candidate = { name, path };
        if (getMergedApps().some(app => sameApp(app, candidate))) {
          alert('同じファイルはすでに登録されています。');
          return;
        }

        const newApp = {
          id: `custom-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
          name,
          path,
          desc: desc || '説明はありません。',
          emoji: emoji || '📦',
          source: 'custom'
        };

        customApps.push(newApp);
        localStorage.setItem(STORAGE_KEYS.custom, JSON.stringify(customApps));
        renderApps();
        closeModal();
      });
    }

    window.deleteCustomApp = function(id) {
      if (!confirm('このローカル登録を一覧から削除しますか？（HTMLファイル自体は削除されません）')) {
        return;
      }
      customApps = customApps.filter(app => app.id !== id);
      localStorage.setItem(STORAGE_KEYS.custom, JSON.stringify(customApps));
      renderApps();
    };

    window.addEventListener('DOMContentLoaded', () => {
      renderApps();
      setupModalEvents();
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test App</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #020617;
      color: #e2e8f0;
      padding: 24px;
    }
    .card {
      width: min(560px, 100%);
      padding: 32px;
      border: 1px solid #1e293b;
      border-radius: 24px;
      background: #0f172a;
      box-shadow: 0 24px 80px rgba(0,0,0,.35);
    }
    .badge {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      background: #312e81;
      color: #c7d2fe;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 14px;
    }
    h1 { margin: 0 0 10px; font-size: 28px; }
    p { color: #94a3b8; line-height: 1.7; }
    .counter {
      font-size: 56px;
      font-weight: 800;
      margin: 26px 0;
      text-align: center;
      color: #a5b4fc;
    }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    button, a {
      border: 0;
      border-radius: 14px;
      padding: 13px 16px;
      font: inherit;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }
    button { background: #4f46e5; color: white; }
    button:hover { background: #6366f1; }
    a { background: #020617; color: #cbd5e1; border: 1px solid #334155; }
    .status {
      margin-top: 20px;
      padding: 12px 14px;
      border-radius: 12px;
      background: #052e16;
      color: #86efac;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">My App Toolbox / TEST</span>
    <h1>テストアプリ</h1>
    <p>ツール追加、JavaScript実行、ポータルからの遷移が正常に動くか確認するためのテスト用アプリです。</p>

    <div id="counter" class="counter">0</div>

    <div class="actions">
      <button id="countButton" type="button">カウント +1</button>
      <a href="index.html">ポータルへ戻る</a>
    </div>

    <div id="status" class="status">JavaScript: 起動確認中...</div>
  </main>

  <script>
    let count = 0;
    const counter = document.getElementById('counter');
    const status = document.getElementById('status');
    const button = document.getElementById('countButton');

    status.textContent = 'JavaScript: 正常に動作しています';

    button.addEventListener('click', () => {
      count += 1;
      counter.textContent = count;
    });
  </script>
</body>
</html>
